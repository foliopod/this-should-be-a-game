<h2>Recent Posts</h2>
<ul>
  {{ range first 1 (where .Site.RegularPages "Type" "blog") }}
      <article class="post on-list">
        <h1 class="post-title">
          Latest Episode: <a href="{{ .Permalink }}">{{ .Title | markdownify }}</a>
        </h1>

        <div class="post-meta">
          {{- if .Date -}}
            <time class="post-date">
              {{- .Date.Format "2006-01-02" -}}
            </time>
          {{- end -}}
          {{- with .Params.Author -}}
            <span class="post-author">{{ . }}</span>
  {{ end }}
</ul>
